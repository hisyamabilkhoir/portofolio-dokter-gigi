<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="invBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <linearGradient id="invGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <filter id="invShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="480" height="320" rx="8" fill="url(#invBgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="22" y="22" width="456" height="296" rx="4" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="26" y="26" width="448" height="288" rx="3" fill="none" stroke="#bae6fd" stroke-width="0.8"/>

  <!-- Invisalign Logo & Starburst -->
  <g transform="translate(250, 85)">
    <!-- Starburst icon -->
    <g transform="translate(-105, 0)">
      <circle cx="0" cy="-14" r="2.5" fill="#0284c7"/>
      <circle cx="9" cy="-9" r="2.5" fill="#0284c7"/>
      <circle cx="14" cy="0" r="2.5" fill="#0284c7"/>
      <circle cx="9" cy="9" r="2.5" fill="#0284c7"/>
      <circle cx="0" cy="14" r="2.5" fill="#0284c7"/>
      <circle cx="-9" cy="9" r="2.5" fill="#0284c7"/>
      <circle cx="-14" cy="0" r="2.5" fill="#0284c7"/>
      <circle cx="-9" cy="-9" r="2.5" fill="#0284c7"/>
      
      <!-- Inner ring -->
      <circle cx="0" cy="-7" r="2" fill="#0ea5e9"/>
      <circle cx="7" cy="0" r="2" fill="#0ea5e9"/>
      <circle cx="0" cy="7" r="2" fill="#0ea5e9"/>
      <circle cx="-7" cy="0" r="2" fill="#0ea5e9"/>
    </g>

    <!-- Text Logo -->
    <text x="-80" y="8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="-1">invisalign<tspan font-size="14" font-weight="700" dy="-10">®</tspan></text>
  </g>

  <!-- Subtitle -->
  <text x="250" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="3">CERTIFIED PROVIDER</text>
  <text x="250" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="3">ALIGN TECHNOLOGY</text>
  
  <line x1="150" y1="185" x2="350" y2="185" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="250" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">drg. Andini Putri, Sp.Ort</text>
  <text x="250" y="228" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">Has successfully completed the Invisalign Clinical Certification</text>

  <!-- Signature on Left -->
  <g transform="translate(190, 265)">
    <path d="M -40,5 Q -20,-20 0,0 Q 15,-15 30,5 Q 40,10 55,-5" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="-50" y1="16" x2="50" y2="16" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#475569" text-anchor="middle">Clinical Director Align Tech</text>
  </g>

  <!-- Gold Seal on Right -->
  <g transform="translate(370, 262)">
    <circle cx="0" cy="0" r="25" fill="url(#invGold)" filter="url(#invShadow)"/>
    <circle cx="0" cy="0" r="21" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="0" cy="0" r="17" fill="url(#invGold)" stroke="#78350f" stroke-width="0.5"/>
    <text x="0" y="1" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#451a03" text-anchor="middle">OFFICIAL</text>
    <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="4" font-weight="700" fill="#78350f" text-anchor="middle">ALIGN PROVIDER</text>
  </g>
</svg>
