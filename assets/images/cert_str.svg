<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <linearGradient id="strBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <filter id="strShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Frame with Security Border -->
  <rect x="10" y="10" width="480" height="320" rx="8" fill="url(#strBgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="22" y="22" width="456" height="296" rx="4" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="26" y="26" width="448" height="288" rx="3" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- Kemenkes Logo Top -->
  <g transform="translate(250, 70)">
    <!-- Heart / Cross Green Medical Emblem -->
    <g transform="translate(-135, -12)">
      <circle cx="0" cy="0" r="14" fill="#059669"/>
      <path d="M-6,0 L6,0 M0,-6 L0,6" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="10" cy="-6" r="4" fill="#0284c7"/>
    </g>
    <text x="-110" y="-3" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#047857" letter-spacing="1">KEMENTERIAN KESEHATAN</text>
    <text x="-110" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0f172a" letter-spacing="2">REPUBLIK INDONESIA</text>
  </g>

  <!-- STR Title -->
  <text x="250" y="140" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2.5">SURAT TANDA REGISTRASI</text>
  <text x="250" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="1">DOKTER GIGI SPESIALIS ORTODONTI</text>
  
  <line x1="140" y1="175" x2="360" y2="175" stroke="#cbd5e1" stroke-width="1"/>

  <text x="250" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Nomor Registrasi: 32.1.2.100.3.21.145892</text>
  <text x="250" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">drg. Andini Putri, Sp.Ort</text>
  <text x="250" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">Kompetensi: Ortodonti &amp; Ortopedi Dentofasial</text>

  <!-- Official Signature & KKI Stamp -->
  <g transform="translate(250, 280)">
    <!-- Stamp -->
    <circle cx="-50" cy="-5" r="20" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.65"/>
    <text x="-50" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#0284c7" text-anchor="middle" opacity="0.7">KONSIL KEDOKTERAN</text>
    <text x="-50" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#0284c7" text-anchor="middle" opacity="0.7">INDONESIA</text>
    
    <!-- Signature -->
    <path d="M 0,-10 Q 25,-30 45,-5 Q 60,-20 80,-10" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="-10" y1="5" x2="90" y2="5" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="40" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Ketua Divisi Registrasi Dokter Gigi KKI</text>
  </g>
</svg>
