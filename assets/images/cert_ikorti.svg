<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Gold Medal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="10" y="10" width="480" height="320" rx="8" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Inner Ornate Borders -->
  <rect x="22" y="22" width="456" height="296" rx="4" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,2"/>
  <rect x="26" y="26" width="448" height="288" rx="3" fill="none" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Corner Flourishes -->
  <path d="M 28 42 L 42 28 M 28 48 L 48 28 M 28 34 L 34 28" stroke="#0284c7" stroke-width="1.2" fill="none"/>
  <path d="M 472 42 L 458 28 M 472 48 L 452 28 M 472 34 L 466 28" stroke="#0284c7" stroke-width="1.2" fill="none"/>
  <path d="M 28 298 L 42 312 M 28 292 L 48 312 M 28 306 L 34 312" stroke="#0284c7" stroke-width="1.2" fill="none"/>
  <path d="M 472 298 L 458 312 M 472 292 L 452 312 M 472 306 L 466 312" stroke="#0284c7" stroke-width="1.2" fill="none"/>

  <!-- IKORTI Emblem Logo -->
  <g transform="translate(250, 75)">
    <!-- Outer blue circle -->
    <circle cx="0" cy="0" r="22" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Compass star -->
    <polygon points="0,-18 4,-5 18,0 4,4 0,18 -4,4 -18,0 -4,-5" fill="#ffffff"/>
    <polygon points="0,-18 3,-3 0,0" fill="#e2e8f0"/>
    <polygon points="18,0 3,3 0,0" fill="#e2e8f0"/>
    <polygon points="0,18 -3,3 0,0" fill="#e2e8f0"/>
    <polygon points="-18,0 -3,-3 0,0" fill="#e2e8f0"/>
    <!-- Center tooth/red dot -->
    <circle cx="0" cy="0" r="5" fill="#ef4444"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Title Text -->
  <text x="250" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">IKORTI</text>
  <text x="250" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0284c7" text-anchor="middle" letter-spacing="1.5">IKATAN ORTODONTIS INDONESIA</text>
  
  <line x1="160" y1="152" x2="340" y2="152" stroke="#e2e8f0" stroke-width="1"/>

  <text x="250" y="178" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="15" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="2">SERTIFIKAT KEANGGOTAAN</text>
  <text x="250" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">Diberikan kepada Anggota Aktif Spesialis Ortodonti</text>
  <text x="250" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">drg. Andini Putri, Sp.Ort</text>

  <!-- Gold Seal on Bottom Left/Center -->
  <g transform="translate(180, 268)">
    <!-- Ribbon tails -->
    <path d="M-10,12 L-16,36 L-6,30 L4,36 L0,12 Z" fill="#b45309"/>
    <path d="M0,12 L-4,36 L6,30 L16,36 L10,12 Z" fill="#d97706"/>
    <!-- Gold Medallion -->
    <circle cx="0" cy="0" r="24" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.5"/>
    <text x="0" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="800" fill="#451a03" text-anchor="middle" letter-spacing="0.5">VERIFIED</text>
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-size="4" font-weight="700" fill="#78350f" text-anchor="middle">IKORTI</text>
  </g>

  <!-- Signature on Right -->
  <g transform="translate(340, 255)">
    <path d="M -40,10 Q -20,-15 0,5 Q 15,-10 30,-2 Q 40,5 50,-5" fill="none" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="-50" y1="20" x2="50" y2="20" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#475569" text-anchor="middle">Ketua Pengurus Pusat IKORTI</text>
  </g>
</svg>
